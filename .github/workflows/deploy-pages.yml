name: Deploy archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      detect_changes:
        description: '새 자료가 있을 때만 갱신'
        type: boolean
        default: false
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.watch.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            editorial
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check source metadata before processing
        id: watch
        run: node scripts/check-content-changes.mjs "${CHECK_MODE}"
        env:
          CHECK_MODE: ${{ (github.event_name == 'schedule' || inputs.detect_changes) && '--check' || '--force' }}
          GITHUB_TOKEN: ${{ github.token }}
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve latest released text source
        id: upstream
        run: node scripts/update-content.mjs --plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache verified source blobs
        uses: actions/cache@v4
        with:
          path: .cache/upstream-content/blobs
          key: hsr-upstream-v2-${{ steps.upstream.outputs.commit }}
          restore-keys: |
            hsr-upstream-v2-
            hsr-upstream-v1-
      - name: Restore derived video review progress
        uses: actions/cache@v4
        with:
          path: public/video-order-provenance.json
          key: hsr-video-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hsr-video-review-v1-
      - name: Refresh Korean content, books and comparison languages
        run: node scripts/update-content.mjs --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test archive behavior
        run: pnpm test
      - name: Refresh official YouTube video
        run: node scripts/update-official-videos.mjs
      - name: Build static site
        run: |
          node scripts/check-content-changes.mjs --record
          pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
