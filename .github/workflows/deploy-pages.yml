name: Deploy archive to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/reports/**'
  workflow_dispatch:
    inputs:
      detect_changes:
        description: '새 자료가 있을 때만 갱신'
        type: boolean
        default: false
      trailblaze_title:
        description: 'BWIKI만 재검증할 개척 임무 장 제목 (비워 두면 기본 갱신)'
        type: string
        default: ''
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  # The previous queue was orphaned after every job finished during an Actions incident.
  # Keep all new publication runs serialized without waiting for that cancelled run.
  group: github-pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HSR_PRIVATE_STATE_URL: ${{ vars.HSR_DATA_MODE == 'protected' && vars.HSR_DATA_API_URL || '' }}
      HSR_PRIVATE_STATE_TOKEN: ${{ vars.HSR_DATA_MODE == 'protected' && secrets.HSR_PRIVATE_STATE_TOKEN || '' }}
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.refresh.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check publishing mode and private prerequisites
        env:
          SOURCE_IS_PRIVATE: ${{ github.event.repository.private }}
          API_URL: ${{ vars.HSR_DATA_API_URL }}
          HSR_DATA_MODE: ${{ vars.HSR_DATA_MODE }}
        run: |
          node --input-type=module -e 'import { assertPublishingMode } from "./scripts/deploy-protected-candidate.mjs"; assertPublishingMode(process.env);'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore retry schedule and run journal
        uses: actions/cache/restore@v4
        with:
          path: .cache/verification-retry
          key: hsr-verification-retry-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hsr-verification-retry-v1-
      - name: Restore source-first checkpoints and independent collection schedule
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/source-first/api
            .cache/source-first/results
            .cache/source-first/document-results
            .cache/source-first/missions
            .cache/source-first/collection-state.json
          key: hsr-source-first-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hsr-source-first-v1-
      - name: Check source metadata before processing
        id: watch
        run: node scripts/check-content-changes.mjs "${CHECK_MODE}"
        env:
          CHECK_MODE: ${{ (github.event_name == 'schedule' || inputs.detect_changes) && '--check' || '--force' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore last successfully deployed derived data
        if: steps.watch.outputs.changed == 'true'
        run: node scripts/prepare-verification.mjs --restore
      - name: Set up pnpm
        if: steps.watch.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Install dependencies
        if: steps.watch.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        if: steps.watch.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve latest released text source
        if: steps.watch.outputs.changed == 'true'
        id: upstream
        run: node scripts/update-content.mjs --plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache verified source blobs
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/upstream-content/blobs
          key: hsr-upstream-v2-${{ steps.upstream.outputs.commit }}
          restore-keys: |
            hsr-upstream-v2-
            hsr-upstream-v1-
      - name: Restore content-addressed BWIKI snapshots
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/upstream-content/bwiki
          key: hsr-bwiki-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hsr-bwiki-snapshots-v1-
      - name: Refresh changed sources or retry unresolved BWIKI and YouTube sections
        if: steps.watch.outputs.changed == 'true'
        id: refresh
        run: node scripts/run-content-refresh.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSR_TRAILBLAZE_TITLE: ${{ inputs.trailblaze_title }}
      - name: Refresh official YouTube video
        if: steps.refresh.outputs.publish == 'true' && steps.refresh.outputs.site_only != 'true'
        run: node scripts/update-official-videos.mjs
      - name: Validate final content contracts
        if: steps.refresh.outputs.publish == 'true'
        run: |
          node scripts/source-first-publication.mjs --seal
          python scripts/validate-content-stage.py .
      - name: Test archive behavior
        if: steps.refresh.outputs.publish == 'true'
        run: pnpm test
      - name: Record processed revisions
        if: steps.watch.outputs.changed == 'true' && steps.refresh.outputs.site_only != 'true' && success()
        run: node scripts/check-content-changes.mjs --record
      - name: Preserve validated derived data for the next deployment
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
        run: node scripts/prepare-verification.mjs --pack
      - name: Build static site
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
        run: |
          pnpm build
      - name: Configure Pages
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
        uses: actions/configure-pages@v5
      - name: Verify the built artifact is the tested data
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
        run: node scripts/source-first-publication.mjs --check-build
      - name: Upload built site
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Build and verify isolated protected candidate
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE == 'protected'
        env:
          VITE_DATA_API_URL: ${{ vars.HSR_DATA_API_URL }}
        run: |
          pnpm build:protected
          node scripts/check-protected-candidate.mjs
      - name: Publish protected data and sanitized public frontend
        if: steps.refresh.outputs.publish == 'true' && vars.HSR_DATA_MODE == 'protected'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HSR_WORKER_NAME: ${{ vars.HSR_WORKER_NAME }}
          HSR_R2_BUCKET: ${{ vars.HSR_R2_BUCKET }}
          HSR_FRONTEND_REPOSITORY: ${{ vars.HSR_FRONTEND_REPOSITORY }}
          HSR_FRONTEND_TOKEN: ${{ secrets.HSR_FRONTEND_TOKEN }}
        run: node scripts/deploy-protected-candidate.mjs --deploy
      - name: Save BWIKI snapshots
        if: always() && steps.watch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/upstream-content/bwiki
          key: hsr-bwiki-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve protected candidate receipt privately
        if: always() && vars.HSR_DATA_MODE == 'protected' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: protected-candidate-${{ github.run_id }}
          path: .cache/protected/candidate.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save retry schedule and run journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/verification-retry
          key: hsr-verification-retry-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload verification run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-run-${{ github.run_id }}
          path: |
            .cache/content-watch/check.json
            .cache/verification-retry/run.json
            .cache/source-first/report.json
            .cache/source-first/validator-health.json
            .cache/source-first/artifact-seal.json
          if-no-files-found: warn
          retention-days: 90
      - name: Save source-first checkpoints even if a later stage fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/source-first/api
            .cache/source-first/results
            .cache/source-first/document-results
            .cache/source-first/missions
            .cache/source-first/collection-state.json
          key: hsr-source-first-v1-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && vars.HSR_DATA_MODE != 'protected'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
